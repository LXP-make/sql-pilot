<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Pilot - SQL性能优化助手</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f5f6f8; color: #1e293b; }
    .app-container { min-height: 100vh; display: flex; flex-direction: column; }
    .app-header { background: #1e293b; color: white; padding: 0 1rem; height: 56px; display: flex; align-items: center; border-bottom: 1px solid #334155; }
    .header-content { max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .logo-text { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
    .nav-menu { display: flex; gap: 0.25rem; }
    .nav-item { color: #94a3b8; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; transition: all 0.15s ease; }
    .nav-item:hover { color: white; background: #334155; }
    .nav-item.active { color: white; background: #2563eb; }
    .app-main { flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; padding: 1.5rem 2rem; }
    .app-footer { text-align: center; padding: 1rem; color: #94a3b8; font-size: 0.8rem; border-top: 1px solid #e2e8f0; }
    .code-block { background: #0f172a; color: #e2e8f0; padding: 0.875rem; border-radius: 6px; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; overflow-x: auto; white-space: pre-wrap; line-height: 1.5; }
    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-bottom: 0.25rem; }
    .page-header p { color: #64748b; font-size: 0.9rem; }
    .btn { padding: 0.5rem 1.25rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 0.375rem; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: white; color: #475569; border: 1px solid #d1d5db; }
    .btn-secondary:hover { border-color: #94a3b8; }
    .btn-success { background: #16a34a; color: white; }
    .btn-success:hover { background: #15803d; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .card-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 1rem; color: #1e293b; padding-bottom: 0.75rem; border-bottom: 1px solid #e2e8f0; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.375rem; font-size: 0.85rem; font-weight: 600; color: #475569; }
    textarea, input[type="text"], select { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.875rem; color: #1e293b; }
    textarea { font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.5; resize: vertical; }
    textarea:focus, input[type="text"]:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1); }
    .form-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .rating-stars { display: flex; gap: 0.25rem; }
    .star { cursor: pointer; color: #d1d5db; font-size: 1.5rem; transition: color 0.15s; }
    .star.active, .star.filled { color: #f59e0b; }
    .feedback-section { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; }
    .feedback-section h4 { font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 0.5rem; }
    .examples { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .example-item { background: #f8fafc; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.85rem; color: #64748b; cursor: pointer; border: 1px solid #e2e8f0; transition: all 0.15s ease; }
    .example-item:hover { background: #eff6ff; color: #2563eb; border-color: #2563eb; }
    .loading { opacity: 0.6; pointer-events: none; }
    .hero-section { display: flex; align-items: center; justify-content: space-between; gap: 4rem; padding: 3rem 2rem; margin-bottom: 3rem; background: white; border: 1px solid #e2e8f0; border-radius: 12px; }
    .hero-title { font-size: 2.5rem; font-weight: 800; color: #1e293b; margin-bottom: 0.5rem; }
    .hero-subtitle { font-size: 1.25rem; color: #2563eb; font-weight: 600; margin-bottom: 0.75rem; }
    .hero-desc { font-size: 1rem; color: #64748b; margin-bottom: 2rem; max-width: 480px; line-height: 1.6; }
    .hero-buttons { display: flex; gap: 0.75rem; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
    .feature-card { background: white; padding: 1.5rem; border-radius: 10px; border: 1px solid #e2e8f0; transition: all 0.15s ease; }
    .feature-card:hover { border-color: #93c5fd; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
    .feature-card h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; color: #1e293b; }
    .feature-card p { color: #64748b; font-size: 0.9rem; line-height: 1.5; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .stat-card { text-align: center; padding: 1rem; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: #2563eb; margin-bottom: 0.25rem; }
    .stat-label { font-size: 0.8rem; color: #64748b; }
    .history-type { padding: 0.2rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .history-type.user { background: #dbeafe; color: #2563eb; }
    .history-type.assistant { background: #dcfce7; color: #16a34a; }
    .timeline { position: relative; padding-left: 2rem; }
    .timeline::before { content: ''; position: absolute; left: 0.5rem; top: 0; bottom: 0; width: 2px; background: #e2e8f0; }
    .timeline-item { position: relative; margin-bottom: 1.5rem; }
    .timeline-dot { position: absolute; left: -1.625rem; top: 1.25rem; width: 0.75rem; height: 0.75rem; border-radius: 50%; border: 2px solid #e2e8f0; background: white; }
    .timeline-dot.user { border-color: #2563eb; background: #dbeafe; }
    .timeline-dot.assistant { border-color: #16a34a; background: #dcfce7; }
    .filter-row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .filter-row input { flex: 1; max-width: 300px; }
    .filter-row select { width: auto; min-width: 140px; }
    .pagination { display: flex; align-items: center; gap: 0.75rem; justify-content: center; margin-top: 1.5rem; }
    .page-info { font-size: 0.85rem; color: #64748b; }
    .btn-sm { padding: 0.375rem 0.75rem; font-size: 0.8rem; }
    .empty-state { text-align: center; padding: 4rem 2rem; background: white; border: 1px solid #e2e8f0; border-radius: 10px; }
    .empty-state p { color: #64748b; margin-bottom: 0.5rem; }
    .empty-state .empty-hint { font-size: 0.9rem; color: #94a3b8; }
    .execution-status { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; font-weight: 600; }
    .execution-status.success { background: #dcfce7; color: #16a34a; }
    .execution-status.error { background: #fee2e2; color: #dc2626; }
    @media (max-width: 900px) { .main-content { grid-template-columns: 1fr; } .hero-section { flex-direction: column; gap: 2rem; } .hero-title { font-size: 2rem; } .filter-row { flex-direction: column; align-items: stretch; } .filter-row input { max-width: 100%; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/src/main.js"></script>
</body>
</html>
